<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Rovo helps across the SDLC</title>
<style>
/* Atlassian Design System palette (light theme token values) */
:root{
  --ds-surface:#FFFFFF;
  --ds-surface-sunken:#F7F8F9;     /* Neutral100 */
  --ds-neutral-200:#F1F2F4;
  --ds-neutral-300:#DCDFE4;
  --ds-border:#091E4224;
  --ds-text:#172B4D;               /* Neutral1000 */
  --ds-text-subtle:#44546F;        /* Neutral800 */
  --ds-text-subtlest:#626F86;      /* Neutral700 */
  --ds-brand:#0C66E4;              /* Blue700 */
  --ds-brand-hover:#0055CC;        /* Blue800 */
  --ds-blue-100:#E9F2FF;
  --ds-blue-200:#CCE0FF;
  --ds-orange-100:#FFF3EB;
  --ds-orange-200:#FEDEC8;
  --ds-orange-400:#FAA53D;
  --ds-orange-600:#E56910;
  --ds-orange-700:#A54800;
  --ds-green-100:#DCFFF1;
  --ds-green-200:#BAF3DB;
  --ds-green-400:#4BCE97;
  --ds-green-600:#22A06B;
  --ds-green-700:#1F845A;
  --ds-green-800:#216E4E;
  --ds-purple-100:#F3F0FF;
  --ds-purple-700:#6E5DC6;
  --ds-shadow-raised:0 1px 1px #091E4240,0 0 1px #091E424F;
  --ds-shadow-overlay:0 8px 12px #091E4226,0 0 1px #091E424F;
  --p1:var(--ds-orange-600); --p1-soft:var(--ds-orange-100); --p1-deep:var(--ds-orange-700); --p1-mid:var(--ds-orange-400);
  --p2:var(--ds-green-600);  --p2-soft:var(--ds-green-100);  --p2-deep:var(--ds-green-800);  --p2-mid:var(--ds-green-400);
  --font:"Atlassian Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,"PingFang SC","Hiragino Sans GB",system-ui,"Helvetica Neue",sans-serif;
  --mono:"Atlassian Mono",ui-monospace,Menlo,"Segoe UI Mono","Ubuntu Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ds-surface-sunken);color:var(--ds-text);font-family:var(--font);line-height:1.5;padding:0 0 90px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}

/* top nav, styled like an Atlassian app header */
.nav{background:var(--ds-surface);border-bottom:1px solid var(--ds-border);margin-bottom:28px}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
.crumb{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ds-text-subtle);font-weight:500}
.crumb .mark{width:24px;height:24px;border-radius:6px;background:var(--ds-brand);display:grid;place-items:center}
.crumb b{color:var(--ds-text);font-weight:653}
.lang{display:inline-flex;background:var(--ds-neutral-200);border-radius:6px;padding:2px}
.lang button{border:0;background:transparent;font:500 14px var(--font);padding:5px 14px;border-radius:4px;cursor:pointer;color:var(--ds-text-subtle)}
.lang button.on{background:var(--ds-surface);color:var(--ds-brand);box-shadow:var(--ds-shadow-raised);font-weight:653}

h1{font-weight:653;font-size:clamp(28px,3.6vw,40px);line-height:1.15;letter-spacing:-.01em}
.lede{margin-top:10px;max-width:820px;font-size:16px;color:var(--ds-text-subtle)}

.card{background:var(--ds-surface);border-radius:8px;box-shadow:var(--ds-shadow-raised)}

/* hero */
.hero{margin-top:22px;padding:20px 24px 16px;position:relative;overflow:hidden}
.hero-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hero h2{font-size:20px;font-weight:653}
.stat-toggle{display:inline-flex;gap:4px}
.stat-toggle button{border:0;background:var(--ds-neutral-200);padding:6px 14px;font:653 14px var(--font);cursor:pointer;color:var(--ds-text-subtle);border-radius:4px}
.stat-toggle button:hover{background:var(--ds-neutral-300)}
.stat-toggle button.on[data-m="16"]{background:var(--p2);color:#fff}
.stat-toggle button.on[data-m="84"]{background:var(--p1);color:#fff}
.loop-wrap{position:relative;width:100%;height:clamp(300px,44vw,470px);margin-top:4px}
.loop-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.seg{transition:stroke .45s ease}
.seg-outline{opacity:0;transition:opacity .3s}
.seg-outline.on{opacity:1}
.stage-lbl{font:700 11px var(--font);letter-spacing:.05em;fill:var(--ds-text);pointer-events:none}
.center-lbl{font:700 9.5px var(--font);letter-spacing:.07em;fill:var(--ds-text);paint-order:stroke;stroke:#fff;stroke-width:4px}
.chal{transition:opacity .45s ease}
.chal rect{fill:#fff;stroke:var(--p1-mid);stroke-width:1.2}
.chal text{font:500 12.5px var(--font);fill:var(--ds-text)}
.chal.hit rect{fill:var(--p1);stroke:var(--p1)}
.chal.hit text{fill:#fff;font-weight:653}
.chal.p2.hit rect{fill:var(--p2);stroke:var(--p2)}
.mode-16 .chal{opacity:0;pointer-events:none}
.stat{display:flex;align-items:baseline;justify-content:center;gap:14px;margin-top:-6px}
.stat .n{font-weight:700;font-size:clamp(46px,6vw,72px);line-height:1;letter-spacing:-.03em;transition:color .4s}
.stat .cap{font-size:15px;color:var(--ds-text-subtle);max-width:420px}
.mode-16 .stat .n{color:var(--p2)} .mode-84 .stat .n{color:var(--p1)}
.hero-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--ds-border);display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--ds-text-subtle)}
.hero-foot b{color:var(--ds-text)}
.key{display:inline-flex;align-items:center;gap:7px}
.key i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* parts */
.part{margin-top:24px;padding:24px 26px 22px;position:relative;border-top:4px solid}
.part.one{border-top-color:var(--p1)} .part.two{border-top-color:var(--p2)}
.part-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.part-icon{width:48px;height:48px;border-radius:8px;display:grid;place-items:center}
.one .part-icon{background:var(--p1-soft);color:var(--p1)} .two .part-icon{background:var(--p2-soft);color:var(--p2)}
.lozenge{display:inline-block;font:700 11px var(--font);text-transform:uppercase;letter-spacing:.02em;padding:2px 6px;border-radius:3px;line-height:16px}
.one .part-kicker{background:var(--ds-orange-200);color:var(--p1-deep)}
.two .part-kicker{background:var(--ds-green-200);color:var(--p2-deep)}
.part h2{font-size:clamp(20px,2.4vw,26px);font-weight:653;line-height:1.25;margin-top:6px}
.part .why{margin-top:6px;color:var(--ds-text-subtle);font-size:15px;max-width:860px}
.verbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.verbs span{font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--p1-soft);color:var(--p1-deep);border:1px solid var(--ds-orange-200)}
.two .verbs span{background:var(--p2-soft);color:var(--p2-deep);border-color:var(--ds-green-200)}

.gates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.gate{border-radius:6px;padding:12px 14px 12px 12px;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px}
.gate.a{background:var(--ds-blue-100)} .gate.a .gi{color:var(--ds-brand)}
.gate.w{background:var(--ds-orange-100)} .gate.w .gi{color:var(--p1)}
.gate h4{font-size:14px;font-weight:653}
.gate p{font-size:13px;color:var(--ds-text-subtle);margin-top:2px}

/* step track */
.track{margin-top:24px;display:grid;position:relative}
.track.n8{grid-template-columns:repeat(8,minmax(0,1fr))}
.track.n6{grid-template-columns:repeat(6,minmax(0,1fr))}
.track::before{content:"";position:absolute;left:6%;right:6%;top:27px;height:2px;background:var(--ds-neutral-300)}
.step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;padding:0 4px;background:none;border:0;font:inherit;color:inherit}
.step:focus-visible{outline:2px solid #388BFF;outline-offset:2px;border-radius:6px}
.dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ds-surface);border:2px solid var(--ds-neutral-300);color:var(--ds-text-subtle);position:relative;z-index:1;transition:transform .2s,background .2s,border-color .2s,color .2s,box-shadow .2s}
.dot .no{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;border-radius:10px;font:700 11px/20px var(--font);background:var(--ds-text);color:#fff;padding:0 5px}
.step:hover .dot{transform:translateY(-2px);box-shadow:var(--ds-shadow-overlay)}
.one .step.hl .dot{border-color:var(--p1-mid);color:var(--p1);background:var(--p1-soft)}
.two .step .dot{border-color:var(--p2-mid);color:var(--p2);background:var(--p2-soft)}
.one .step.sel .dot{background:var(--p1);border-color:var(--p1);color:#fff;box-shadow:var(--ds-shadow-overlay)}
.one .step.sel:not(.hl) .dot{background:var(--ds-text-subtle);border-color:var(--ds-text-subtle)}
.two .step.sel .dot{background:var(--p2);border-color:var(--p2);color:#fff;box-shadow:var(--ds-shadow-overlay)}
.step .nm{margin-top:9px;font-weight:653;font-size:14px;line-height:1.25}
.step .marks{margin-top:5px;display:flex;gap:4px;justify-content:center;min-height:20px}
.mk{width:20px;height:20px;border-radius:4px;display:grid;place-items:center}
.mk.a{background:var(--ds-blue-100);color:var(--ds-brand)} .mk.w{background:var(--ds-orange-100);color:var(--p1)}
.stg{margin-top:3px;font:500 11px var(--font);color:var(--ds-text-subtlest)}

/* detail */
.detail{margin-top:20px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;border-radius:8px;padding:18px 20px;background:var(--ds-surface-sunken);border:1px solid var(--ds-border);animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.detail .k{font:653 12px var(--font);color:var(--ds-text-subtlest)}
.detail h3{font-size:20px;font-weight:653;margin:3px 0 10px;line-height:1.3}
.detail ul{padding-left:18px;font-size:14px}
.detail li{margin:4px 0}
.detail h5{font:653 12px var(--font);color:var(--ds-text-subtlest);margin:2px 0 7px}
.detail .blk+.blk{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;padding:2px 8px;border-radius:3px;line-height:18px}
.chip.ch{background:var(--ds-surface);border:1px solid var(--p1-mid);color:var(--p1-deep)}
.two .chip.ch{border-color:var(--p2-mid);color:var(--p2-deep)}
.chip.pr{background:var(--ds-blue-100);color:var(--ds-brand-hover);font-weight:653;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em}
.chip.pr.rovo{background:var(--ds-purple-100);color:var(--ds-purple-700)}
.chip.gt{background:var(--ds-neutral-200);color:var(--ds-text)}

/* feedback */
.feedback{margin-top:24px;padding:18px 22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;border-left:4px solid var(--ds-brand)}
.feedback .ic{width:40px;height:40px;border-radius:8px;background:var(--ds-blue-100);color:var(--ds-brand);display:grid;place-items:center}
.feedback h3{font-weight:653;font-size:17px}
.feedback p{font-size:14px;color:var(--ds-text-subtle);margin-top:2px}

.print-all{display:none}

@media (max-width:900px){
  .track.n8,.track.n6{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:18px}
  .track::before{display:none}
  .detail,.gates{grid-template-columns:minmax(0,1fr)}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .nav,.stat-toggle{display:none}
  .hero,.part,.feedback{break-inside:avoid}
  .part{break-before:page}
  .detail{display:none}
  .print-all{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin-top:16px;font-size:11.5px}
  .print-all div{border-top:1px solid var(--ds-border);padding-top:6px}
  .print-all b{display:block;font-size:12.5px}
}
</style>
</head>
<body class="mode-84">

<div class="nav">
  <div class="wrap">
    <div class="crumb">
      <span class="mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></span>
      <span>Rovo</span><span>/</span><b data-i="crumb"></b>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="en" class="on">EN</button>
      <button data-l="zh">中文</button>
    </div>
  </div>
</div>

<div class="wrap">
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>

  <section class="card hero" id="hero">
    <div class="hero-bar">
      <h2 id="heroTitle"></h2>
      <div class="stat-toggle" role="group">
        <button data-m="16">16%</button>
        <button data-m="84" class="on">84%</button>
      </div>
    </div>
    <div class="loop-wrap"><svg id="loop" viewBox="-580 -235 1160 470" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="stat"><span class="n" id="statN">84%</span><span class="cap" id="statCap"></span></div>
    <div class="hero-foot">
      <span class="key"><i style="background:var(--p1)"></i><b>Part 1</b>&nbsp;<span data-i="keyP1"></span></span>
      <span class="key"><i style="background:var(--p2)"></i><b>Part 2</b>&nbsp;<span data-i="keyP2"></span></span>
    </div>
  </section>

  <section class="card part one" id="part1">
    <div class="part-head">
      <div class="part-icon" data-ico="align"></div>
      <div>
        <span class="lozenge part-kicker" data-i="p1Kicker"></span>
        <h2 data-i="p1Title"></h2>
        <p class="why" data-i="p1Why"></p>
        <div class="verbs" id="p1Verbs"></div>
      </div>
    </div>
    <div class="gates">
      <div class="gate a"><span class="gi" data-ico="search"></span><div><h4 data-i="gateA"></h4><p data-i="gateADesc"></p></div></div>
      <div class="gate w"><span class="gi" data-ico="automation"></span><div><h4 data-i="gateW"></h4><p data-i="gateWDesc"></p></div></div>
    </div>
    <div class="track n8" id="track1"></div>
    <div id="detail1"></div>
    <div class="print-all" id="print1"></div>
  </section>

  <section class="card part two" id="part2">
    <div class="part-head">
      <div class="part-icon" data-ico="code"></div>
      <div>
        <span class="lozenge part-kicker" data-i="p2Kicker"></span>
        <h2 data-i="p2Title"></h2>
        <p class="why" data-i="p2Why"></p>
        <div class="verbs" id="p2Verbs"></div>
      </div>
    </div>
    <div class="track n6" id="track2"></div>
    <div id="detail2"></div>
    <div class="print-all" id="print2"></div>
  </section>

  <section class="card feedback">
    <div class="ic" data-ico="loop"></div>
    <div>
      <h3 data-i="fbTitle"></h3>
      <p data-i="fbText"></p>
    </div>
  </section>
</div>

<script src="assets/icons.js"></script>
<script src="data/content.js"></script>
<script>
/* All copy and step data lives in data/content.js; icons in assets/icons.js. */
const IC=window.SDLC_ICONS;
const {T,STAGES,STAGE_NAME,CH,P1,P2}=window.SDLC;
const ico=(k,s=24,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
document.querySelectorAll("[data-ico]").forEach(e=>e.innerHTML=ico(e.dataset.ico,e.classList.contains("gi")?20:24));

/* ---------------- loop drawing ---------------- */
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('loop');
const A=330;
const P=t=>{const s=Math.sin(t),c=Math.cos(t),d=1+s*s;return[A*c/d,A*s*c/d]};
const PI=Math.PI,G=0.035,CG=0.13;
// left loop t∈[π/2,3π/2]: discover (top-left), plan (far left), develop (bottom-left)
// right loop t∈[3π/2,5π/2]: test (top-right), deploy (far right), operate (bottom-right)
const ranges=[
 [PI/2+CG,PI*0.83-G],[PI*0.83+G,PI*1.17-G],[PI*1.17+G,3*PI/2-CG],
 [3*PI/2+CG,PI*1.83-G],[PI*1.83+G,PI*2.17-G],[PI*2.17+G,5*PI/2-CG]
];
function pathFor(r){let d="";const N=70;for(let i=0;i<=N;i++){const t=r[0]+(r[1]-r[0])*i/N;const[x,y]=P(t);d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)}return d}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e}
el('path',{d:pathFor([0,2*PI]),fill:'none',stroke:'#F1F2F4','stroke-width':74});
const gOut=el('g',{}),gSeg=el('g',{}),gLbl=el('g',{}),gCh=el('g',{});
const segEls={},outEls={},lblEls={};
STAGES.forEach((s,i)=>{
  outEls[s.id]=el('path',{d:pathFor(ranges[i]),fill:'none',stroke:'#172B4D','stroke-width':66,class:'seg-outline'},gOut);
  segEls[s.id]=el('path',{d:pathFor(ranges[i]),fill:'none','stroke-width':56,class:'seg'},gSeg);
  const tm=(ranges[i][0]+ranges[i][1])/2;const[x,y]=P(tm);
  lblEls[s.id]=el('text',{x:x,y:y,'text-anchor':'middle',class:'stage-lbl'},gLbl);
});
const cf=el('text',{x:0,y:4,'text-anchor':'middle',class:'center-lbl'},gLbl);
const chEls={};
Object.entries(CH).forEach(([k,c])=>{
  const g=el('g',{class:'chal'},gCh);
  const r=el('rect',{rx:4,ry:4,height:26},g);
  const t=el('text',{x:c.x,y:c.y+4.5,'text-anchor':c.a},g);
  chEls[k]={g,r,t,c};
});

/* ---------------- state ---------------- */
let lang='en',mode='84',sel1=4,sel2=1,activePart=1;
const $=s=>document.querySelector(s);

function paintLoop(){
  STAGES.forEach(s=>{
    let col='#DCDFE4';
    if(mode==='16'&&!s.in84) col='#4BCE97';
    if(mode==='84'&&s.in84) col='#FAA53D';
    segEls[s.id].setAttribute('stroke',col);
    const lines=s[lang];const t=lblEls[s.id];t.innerHTML='';
    lines.forEach((ln,j)=>{const ts=document.createElementNS(NS,'tspan');ts.setAttribute('x',t.getAttribute('x'));ts.setAttribute('dy',j===0?(lines.length>1?'-3':'4'):'13');ts.textContent=ln;t.appendChild(ts)});
  });
  cf.innerHTML='';
  (lang==='en'?['CONTINUOUS','FEEDBACK']:['持续','反馈']).forEach((ln,j)=>{const ts=document.createElementNS(NS,'tspan');ts.setAttribute('x',0);ts.setAttribute('dy',j?'11':'-2');ts.textContent=ln;cf.appendChild(ts)});
  Object.values(chEls).forEach(({r,t,c})=>{
    t.textContent=c[lang];
    const w=t.getComputedTextLength()+22;
    let x=c.x-w/2; if(c.a==='start')x=c.x-11; if(c.a==='end')x=c.x-w+11;
    r.setAttribute('x',x);r.setAttribute('y',c.y-13);r.setAttribute('width',w);
  });
  focusFromSelection();
}
function focusFromSelection(){
  const step=activePart===1?P1[sel1-1]:P2[sel2-1];
  Object.keys(outEls).forEach(k=>outEls[k].classList.toggle('on',k===step.stage));
  Object.entries(chEls).forEach(([k,o])=>{
    o.g.classList.toggle('hit',step.ch.includes(k));o.g.classList.toggle('p2',activePart===2);
  });
}
function setMode(m){
  mode=m;document.body.classList.remove('mode-16','mode-84');document.body.classList.add('mode-'+m);
  document.querySelectorAll('.stat-toggle button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#statN').textContent=m+'%';
  $('#statCap').textContent=T[lang]['cap'+m];
  $('#heroTitle').textContent=T[lang]['heroTitle'+m];
  paintLoop();
}
const isRovo=p=>/^Rovo/.test(p);
function renderTrack(part){
  const data=part===1?P1:P2,tr=$('#track'+part),sel=part===1?sel1:sel2;
  tr.innerHTML='';
  data.forEach(s=>{
    const b=document.createElement('button');
    b.className='step'+(part===1&&s.hl?' hl':'')+(s.n===sel?' sel':'');
    const marks=part===1?s.marks.map(m=>`<span class="mk ${m}" title="${m==='a'?T[lang].gateA:T[lang].gateW}">${ico(m==='a'?'search':'automation',13,2.2)}</span>`).join(''):'';
    b.innerHTML=`<span class="dot">${ico(s.ic,24,1.9)}<span class="no">${s.n}</span></span><span class="nm">${s[lang].nm}</span>${part===1?`<span class="marks">${marks}</span>`:''}<span class="stg">${STAGE_NAME[s.stage][lang]}</span>`;
    b.onclick=()=>{if(part===1)sel1=s.n;else sel2=s.n;activePart=part;renderTrack(part);renderDetail(part);focusFromSelection()};
    tr.appendChild(b);
  });
}
function renderDetail(part){
  const data=part===1?P1:P2,s=data[(part===1?sel1:sel2)-1],L=T[lang];
  const gateChips=part===1&&s.marks.length?`<div class="blk"><h5>${L.gates}</h5><div class="chips">${s.marks.map(m=>`<span class="chip gt">${m==='a'?L.gateA:L.gateW}</span>`).join('')}</div></div>`:'';
  $('#detail'+part).innerHTML=`<div class="detail">
    <div>
      <div class="k">${String(s.n).padStart(2,'0')} · ${s[lang].nm} · ${STAGE_NAME[s.stage][lang]}</div>
      <h3>${s[lang].t}</h3>
      <h5>${L.what}</h5>
      <ul>${s[lang].d.map(x=>`<li>${x}</li>`).join('')}</ul>
    </div>
    <div>
      <div class="blk"><h5>${L.removes}</h5><div class="chips">${s.ch.map(c=>`<span class="chip ch">${CH[c][lang]}</span>`).join('')}</div></div>
      <div class="blk"><h5>${L.products}</h5><div class="chips">${s.pr.map(p=>`<span class="chip pr${isRovo(p)?' rovo':''}">${p}</span>`).join('')}</div></div>
      ${gateChips}
    </div></div>`;
  $('#print'+part).innerHTML=data.map(x=>`<div><b>${x.n}. ${x[lang].t}</b>${x[lang].d.join(' ')} <i>(${x.pr.join(', ')})</i></div>`).join('');
}
function renderText(){
  document.documentElement.lang=lang==='en'?'en':'zh-Hans';
  document.querySelectorAll('[data-i]').forEach(e=>{const v=T[lang][e.dataset.i];if(typeof v==='string')e.textContent=v});
  $('#p1Verbs').innerHTML=T[lang].verbs1.map(v=>`<span>${v}</span>`).join('');
  $('#p2Verbs').innerHTML=T[lang].verbs2.map(v=>`<span>${v}</span>`).join('');
  document.title=T[lang].title;
}
function renderAll(){renderText();setMode(mode);renderTrack(1);renderTrack(2);renderDetail(1);renderDetail(2);focusFromSelection()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x===b));renderAll()});
document.querySelectorAll('.stat-toggle button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
renderAll();
</script>
</body>
